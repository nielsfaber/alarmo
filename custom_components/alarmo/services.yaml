
arm:
  fields:
    entity_id:
      example: "alarm_control_panel.alarm"
      required: true
      selector:
        entity:
          integration: alarmo
          domain: alarm_control_panel
    code:
      example: "1234"
      required: false
      selector:
        text:
    mode:
      example: "away"
      required: false
      default: away
      selector:
        select:
          translation_key: "arm_mode"
          options:
            - away
            - night
            - home
            - vacation
            - custom
    skip_delay:
      example: false
      required: false
      default: false
      selector:
        boolean:
    force:
      example: false
      required: false
      default: false
      selector:
        boolean:
